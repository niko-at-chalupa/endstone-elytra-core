[package]
name = "elytra-server"
version = "0.1.0"
edition = "2024"
dependencies.workspace = true

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
elytra-core = { path = "../elytra-core" }
elytra-endgit-converter = { path = "../elytra-endgit-converter" }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "chrono"] }
thiserror = "2.0.18"
tokio = "1.52.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
