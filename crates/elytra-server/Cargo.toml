[package]
name = "elytra-server"
version = "0.1.0"
edition = "2024"
dependencies.workspace = true

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
elytra-core = { path = "../elytra-core"}
elytra-endgit-converter = { path = "../elytra-endgit-converter", optional = true }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "macros"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
nikos-endgit-wrapper = { git = "https://github.com/niko-at-chalupa/nikos-endgit-wrapper", optional = true }
tracing-test = "0.2.6"

[features]
endgit = ["dep:elytra-endgit-converter", "dep:nikos-endgit-wrapper"]
